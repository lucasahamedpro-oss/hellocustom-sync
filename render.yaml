services:
  - type: web
    name: hellocustom-sync
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false          # you fill this in the Render dashboard
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB
        value: Validation Designs
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # paste the whole JSON blob here
